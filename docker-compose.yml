services:
  db:
    image: ankane/pgvector:latest # Contenedor oficial con pgvector preinstalado para la IA
    container_name: datasoftean_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - datasoftean_postgres_data:/var/lib/postgresql/data
volumes:
  datasoftean_postgres_data:
