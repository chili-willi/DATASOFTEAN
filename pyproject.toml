[tool.ruff]
# Longitud máxima de línea para Python
line-length = 120
target-version = "py310"

# Excluir directorios generados y entornos virtuales
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "migrations",
    ".venv",
    "venv"
]

[tool.ruff.lint]
# Reglas a habilitar: E (pycodestyle errors), F (Pyflakes), I (isort)
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend-django/init_db.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
